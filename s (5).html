/* =================================================
   CONFIG
================================================= */

const API = "http://localhost:3000/api";

let token =
  localStorage.getItem("store_token");

let store =
  JSON.parse(
    localStorage.getItem("store") || "null"
  );

let cart =
  JSON.parse(
    localStorage.getItem("store_cart") || "[]"
  );

let paymentMethod = "CASH";

let products = [];


/* =================================================
   API
================================================= */

async function request(
  endpoint,
  options={}
){

  options.headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(token){

    options.headers.Authorization =
      "Bearer " + token;

  }

  const response =
    await fetch(
      API + endpoint,
      options
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.message ||
      "Server error"
    );

  }

  return data;

}

/* =================================================
   LOGIN ACTION
================================================= */

async function login(){

  try{

    const data =
      await request(
        "/store/login",
        {
          method:"POST",
          body:JSON.stringify({

            store_id:
              loginStore.value,

            password:
              loginPassword.value

          })
        }
      );


    token=data.token;

    store=data.store;

    localStorage.setItem(
      "store_token",
      token
    );

    localStorage.setItem(
      "store",
      JSON.stringify(store)
    );


    dashboard();

  }catch(error){

    alert(error.message);

  }

}

   REGISTER ACTION
================================================= */

async function registerStore(){

  try{

    await request(
      "/store/register",
      {
        method:"POST",

        body:JSON.stringify({

          store_name:
            regStoreName.value,

          owner_name:
            regOwner.value,

          mobile:
            regMobile.value,

          store_id:
            regStoreId.value,

          password:
            regPassword.value

        })

      }
    );


    alert(
      "Store registered successfully"
    );

    loginPage();

    alert(error.message);

}

/* =================================================
   POS CART
================================================= */

function addPOS(product){

  if(Number(product.stock)<=0){

    alert(
      "Out of stock"
    );

    return;

  }

  const item =
    cart.find(
      x =>
      x.product_id ===
      product.id
    );

  if(item){

    if(
      item.quantity + 1 >
      Number(product.stock)
    ){

      alert(
        "Stock limit reached"
      );

      return;

    }

    item.quantity++;

  }else{

    cart.push({

      product_id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      unit:
        product.unit,

      quantity:1,

      stock:
        Number(product.stock)

    });

  }

  saveStoreCart();

  renderBill();

}


function saveStoreCart(){

  localStorage.setItem(
    "store_cart",
    JSON.stringify(cart)
  );

}


function renderBill(){

  const box =
    document.getElementById(
      "billItems"
    );

  if(!box)return;

  if(!cart.length){

    box.innerHTML=`

    <div style="
      text-align:center;
      color:#8992a2;
      padding:35px 5px
    ">
      🛒<br><br>
      No items added
    </div>

    `;

    subTotal.innerText="₹0.00";

    grandTotal.innerText="₹0.00";

    return;

  }


  box.innerHTML =
    cart.map(
      (item,index)=>`

      <div class="billItem">

        <div class="billRow">

          <b>
            ${item.name}
          </b>

          <b>
            ₹${(
              item.price*
              item.quantity
            ).toFixed(2)}
          </b>

        </div>


        <div class="qty">

          <button
            onclick="changePOSQty(
              ${index},-1
            )">
            −
          </button>

          <b>
            ${item.quantity}
            ${item.unit}
          </b>

          <button
            onclick="changePOSQty(
              ${index},1
            )">
            +
          </button>

          <button
            onclick="removePOS(${index})"
            style="
              margin-left:auto;
              color:#d83232
            ">
            ×
          </button>

        </div>

      </div>

      `
    ).join("");


  const total =
    cart.reduce(
      (sum,item)=>
        sum+
        item.price*
        item.quantity,
      0
    );


  subTotal.innerText =
    "₹"+total.toFixed(2);

  grandTotal.innerText =
    "₹"+total.toFixed(2);

}


function changePOSQty(
 index,
 change
){

  const item =
    cart[index];

  if(change>0 &&
     item.quantity+1 >
     item.stock){

    alert(
      "Cannot sell more than stock"
    );

    return;

  }

  item.quantity +=
    change;

  if(item.quantity<=0){

    cart.splice(index,1);

  }

  saveStoreCart();

  renderBill();

}


function removePOS(index){

  cart.splice(index,1);

  saveStoreCart();

  renderBill();

}


function clearCart(){

  cart=[];

  saveStoreCart();

  renderBill();

}

function selectPayment(

){

    .querySelectorAll(

    .forEach(
      b =>
      b.classList.remove(
        "selected"
      )
    );

  if(method==="CASH")
    cashBtn.classList.add(
      "selected"
    );

  if(method==="UPI")
    upiBtn.classList.add(
      "selected"
    );

  if(method==="KHATA")
    khataBtn.classList.add(
      "selected"
    );

}

================================================= */

async function completeSale(){

  if(!cart.length){

  }


  try{

    const data =
      await request(
        "/store/sale",
        {
          method:"POST",

          body:JSON.stringify({

            payment_method:
              paymentMethod,

            items:
              cart.map(
                item=>({

                  product_id:
                    item.product_id,

                  quantity:
                    item.quantity

                })
              )

          })

        }
      );


    alert(
      "Sale completed successfully\n\n"+
      "Invoice: "+
      data.invoice_no+
      "\nTotal: ₹"+
      data.total
    );


    cart=[];

    saveStoreCart();

    pos();


  }catch(error){

    alert(error.message);

  }

}
