<html lang="en">
<head>
<meta charset="UTF-8">

<title>Local Store -- Customer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

/* HEADER */
.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e7eaf0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:900;
}

.logoIcon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1769e0;
  color:#fff;
}

.profile{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#eef3ff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* LAYOUT */
.layout{
  display:flex;
  min-height:calc(100vh - 70px);
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid #e7eaf0;
  padding:20px 13px;
  position:fixed;
  top:70px;
  bottom:0;
}

.menuTitle{
  font-size:12px;
  color:#8a93a3;
  font-weight:800;
  margin:12px 12px 8px;
  text-transform:uppercase;
}

.menu{
  padding:13px 15px;
  border-radius:12px;
  margin:4px 0;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:700;
}

.menu:hover,
.menu.active{
  background:#edf4ff;
  color:#1769e0;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);

}

/* HERO */
.hero{

  border-radius:24px;

}

}

}

/* SEARCH */

/* STORE */

  align-items:center;

.storeInfo{

.open{

.selectStore{

/* SECTION */

.product{

.productBottom{

/* CART */

  border-radius:20px;
  padding:20px;

  padding:15px 0;

.qty{

.checkout{

/* ORDERS */

  margin-bottom:14px;

/* TRACKING */
.track{

  border-radius:20px;

.trackLine{

  display:flex;
  justify-content:space-between;

.trackLine:before{

  top:18px;

  background:#dce3ed;
}

.step{

  text-align:center;
  z-index:2;

.circle{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#1769e0;
  color:#fff;

/* LOGIN */

  justify-content:center;

</style>

<div id="root"></div>

/* =====================================
   CONFIG
===================================== */

const API =
  "http://localhost:3000/api";


/* =====================================
   STATE
===================================== */

let customer =
  JSON.parse(
    localStorage.getItem(
      "customer"
    ) || "null"
  );

let token =
  localStorage.getItem(
    "customer_token"
  );

let cart =
  JSON.parse(
    localStorage.getItem(
      "cart"
    ) || "[]"
  );

let selectedStore =
  localStorage.getItem(
    "selected_store"
  ) || "";


/* =====================================
   API
===================================== */

async function request(
  endpoint,
  options={}
){

  options.headers={
    "Content-Type":
      "application/json",
    ...(options.headers || {})
  };

  if(token){
    options.headers.Authorization =
      "Bearer " + token;
  }

  const response =
    await fetch(
      API + endpoint,
      options
    );

  const data =
    await response.json();

  if(!response.ok){
    throw new Error(
      data.message ||
      "Server error"
    );
  }

  return data;
}

/* =====================================
   LOGIN ACTION
===================================== */

async function login(){

  try{

    const data =
      await request(
        "/customer/login",
        {
          method:"POST",
          body:JSON.stringify({

            mobile:
              loginMobile.value,

            password:
              loginPassword.value

          })
        }
      );

    token=data.token;

    customer=data.customer;

    localStorage.setItem(
      "customer_token",
      token
    );

    localStorage.setItem(
      "customer",
      JSON.stringify(customer)
    );

    home();

  }catch(error){

    alert(error.message);

  }

}


/* =====================================
   REGISTER ACTION
===================================== */

async function register(){

  try{

    await request(
      "/customer/register",
      {
        method:"POST",
        body:JSON.stringify({

          name:
            regName.value,

          mobile:
            regMobile.value,

          password:
            regPassword.value

        })
      }
    );

    alert(
      "Account created successfully"
    );

    loginPage();

  }catch(error){

    alert(error.message);

  }

}

async function loadStore(){

     storeSearch.value.trim();

   }

   const data =
     await request(
       "/store/"+

       "/products"
     );

   selectedStore=id;

     "selected_store",
     id
   );

   storeResult.innerHTML=`

       class="add"
       onclick='addToCart(${JSON.stringify(p)})'>
       +
     </button>

   </div>

 </div>

 `;

}


/* =====================================
   CART
===================================== */

function addToCart(product){

 const found =
   cart.find(
     x =>
     x.product_id ===
     product.id
   );

 if(found){

   found.quantity += 1;

 }else{

   cart.push({

     product_id:
       product.id,

     name:
       product.name,

     price:
       Number(product.price),

     quantity:1,

     unit:
       product.unit

   });

 }

 saveCart();

 alert(
   product.name+
   " added to cart"
 );

}


function saveCart(){

 localStorage.setItem(
   "cart",
   JSON.stringify(cart)
 );

 updateCartCount();

}


function updateCartCount(){

 const total =
   cart.reduce(
     (sum,item)=>
       sum+item.quantity,
     0
   );

 const el =
   document.getElementById(
     "cartCount"
   );

 if(el)
   el.innerText =
     total ? "("+total+")" : "";

 const stat =
   document.getElementById(
     "cartStat"
   );

 if(stat)
   stat.innerText=total;

}

   <div style="
     text-align:center;
     padding:50px 10px;
   ">

     <div style="
       font-size:60px;
     ">
       🛒
     </div>

     <h2>
       Your cart is empty
     </h2>

     <p style="
       color:#8992a2;
       margin:10px;
     ">
       Add products from your local store.
     </p>

   </div>

   `;

   cartTotal.innerText="₹0";

   return;

 }


 cartList.innerHTML =
   cart.map(
     (item,index)=>`

     <div class="cartItem">

       <div>

         <b>
           ${item.name}
         </b>

         <div style="
           color:#8992a2;
           font-size:13px;
         ">
           ₹${item.price}
           / ${item.unit}
         </div>

       </div>


       <div class="qty">

         <button
           onclick="changeQty(
             ${index},-1
           )">
           −
         </button>

         <b>
           ${item.quantity}
         </b>

         <button
           onclick="changeQty(
             ${index},1
           )">
           +
         </button>

       </div>


       <b>
         ₹${(
           item.price*
           item.quantity
         ).toFixed(2)}
       </b>

     </div>

     `
   ).join("");


 const total =
   cart.reduce(
     (sum,item)=>
       sum+
       item.price*
       item.quantity,
     0
   );

 cartTotal.innerText =
   "₹"+total.toFixed(2);

}


function changeQty(
 index,
 change
){

 cart[index].quantity +=
   change;

 if(
   cart[index].quantity<=0
 ){
   cart.splice(index,1);
 }

 saveCart();

 renderCart();

}

async function placeOrder(
 payment
){

 if(!selectedStore){

   alert(
     "Please select a store"
   );

   return;

 }

 try{

   const data =
     await request(
       "/order/create",
       {
         method:"POST",

         body:
           JSON.stringify({

             store_id:
               selectedStore,

             payment_method:
               payment,

             items:
               cart.map(
                 item=>({

                   product_id:
                     item.product_id,

                   quantity:
                     item.quantity

                 })
               )

           })
       }
     );


   alert(
     "Order placed successfully!\n\n"+
     "Order: "+
     data.order_no+
     "\nTotal: ₹"+
     data.total
   );


   cart=[];

   saveCart();

   ordersPage();


 }catch(error){

   alert(error.message);

 }

}
