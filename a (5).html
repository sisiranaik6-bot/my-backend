const API="http://localhost:3000/api";

let token=localStorage.getItem("admin_token");

let admin=JSON.parse(
localStorage.getItem("admin")||"null"
);


/* ================= API ================= */

async function request(endpoint,options={}){

options.headers={
"Content-Type":"application/json",
...(options.headers||{})
};

if(token){
options.headers.Authorization=
"Bearer "+token;
}

const res=await fetch(API+endpoint,options);

const data=await res.json();

if(!res.ok)
throw new Error(data.message||"Server error");

return data;
}

let allStores=[];

async function loadStores(){

try{

const data=
await request("/admin/stores");

allStores=
data.stores||[];

renderStores(allStores);

}catch(e){

storesBody.innerHTML=
`<tr><td colspan="7">
${e.message}
</td></tr>`;

}

}


function renderStores(list){

storesBody.innerHTML=
list.map(s=>`

<tr>

<td>
<b>${s.store_id}</b>
</td>

<td>
${s.store_name}
</td>

<td>
${s.owner_name||"-"}
</td>

<td>
${s.mobile||"-"}
</td>

<td>

${
s.blocked
?
`<span class="badge red">
BLOCKED
</span>`
:
`<span class="badge green">
ACTIVE
</span>`
}

</td>

<td>

${
s.approved
?
`<span class="badge green">
APPROVED
</span>`
:
`<span class="badge orange">
PENDING
</span>`
}

</td>

<td>

${
!s.approved
?
`<button
class="secondary"
onclick="approveStore(${s.id})">
Approve
</button>`
:""
}

<button
class="secondary"
onclick="toggleStore(${s.id},${s.blocked?0:1})">

${s.blocked?"Unblock":"Block"}

</button>

</td>

</tr>

`).join("");

}


function filterStores(){

const q=
storeSearch.value.toLowerCase();

renderStores(
allStores.filter(
s=>
(s.store_name||"")
.toLowerCase()
.includes(q)
||
(s.store_id||"")
.toLowerCase()
.includes(q)
||
(s.mobile||"")
.includes(q)
)
);

}


async function refreshStores(){

await loadStores();

}

async function approveStore(id){

"/admin/store/"+id+"/approve",
{
method:"POST"
}
);

loadStores();

}catch(e){

alert(e.message);

}

}

async function changePassword(){

try{

await request(
"/admin/password",
{
method:"POST",

body:JSON.stringify({

old_password:
oldPassword.value,

new_password:
newPassword.value

})

}
);

alert(
"Password updated successfully"
);

}catch(e){

alert(e.message);

}

}
